model: 

  SIMformer:
    lr_teacher:  # 测试或者MTT训练track、DC内层训练时的lr
      sgd: 0.5  # TrajDC中的设置
      adam: 0.0005   # 原作者设置的lr为0.0005, 
    num_layers: 1
    n_heads: 16
    pos_encoding: "learnable"

  GRU:
    lr_teacher: 
      sgd: 0.5
      adam: 0.005
    hidden_size: 128  # RNN隐藏状态中的特征数量
    num_layers: 1
    bidirectional: False
    pos_encoding: "learnable"
    
  LSTM:
    lr_teacher:
      sgd: 0.01
      adam: 0.001
    hidden_size: 128  # RNN隐藏状态中的特征数量
    num_layers: 2
    bidirectional: False
    pos_encoding: "learnable"

  TrajCL:
    lr_teacher: 
      sgd: 0.05
      adam: 0.001
    ninput: 128  
    nhidden: 128
    nhead: 4
    hlayer: 2
    attn_dropout: 0.1
    pos_dropout: 0.1
  
  ConvTraj:
    lr_teacher: 
      sgd: 0.1
      adam: 0.001
    channel: 8
    head_num: 1
  
  DualSIMformer:
    lr_teacher: 
      sgd: 0.5 
      adam: 0.0005

    # nhidden: 128



